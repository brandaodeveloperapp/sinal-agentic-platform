apiVersion: apps/v1
kind: Deployment
metadata:
  name: sinal-agent
  namespace: sinal
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: sinal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: sinal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: localhost:5000/sinal/agent:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: ENVIRONMENT
              value: hom
            - name: LOG_LEVEL
              value: info
            - name: MODEL_PROVIDER
              value: scripted
            - name: MCP_SERVER_URL
              value: http://sinal-mcp-server.sinal.svc.cluster.local:8082/mcp
            - name: JWT_ISSUER
              value: https://sinal.local/idp
            - name: JWT_AUDIENCE
              value: sinal-mcp
            - name: REDIS_URL
              value: redis://sinal-redis.sinal.svc.cluster.local:6379
            - name: DOWNSTREAM_SECRET
              valueFrom:
                secretKeyRef:
                  name: sinal-mcp-server
                  key: JWT_SIGNING_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sinal-agent
  namespace: sinal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent
  ports:
    - name: http
      port: 8083
      targetPort: http
