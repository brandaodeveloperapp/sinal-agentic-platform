apiVersion: apps/v1
kind: Deployment
metadata:
  name: sinal-bff
  namespace: sinal
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/part-of: sinal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff
        app.kubernetes.io/part-of: sinal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: localhost:5000/sinal/bff:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: dev
            - name: LOG_LEVEL
              value: info
            - name: PORT
              value: "8080"
            - name: AGENT_URL
              value: http://sinal-agent.sinal.svc.cluster.local:8083
            - name: CORS_ORIGINS
              value: https://app.sinal.brandaodeveloper.com.br
            - name: SESSION_ISSUER
              value: https://sinal.local/idp
            - name: SESSION_AUDIENCE
              value: sinal-bff
            - name: DOWNSTREAM_ISSUER
              value: https://sinal.local/idp
            - name: DOWNSTREAM_AUDIENCE
              value: sinal-mcp
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: sinal-bff
                  key: SESSION_SECRET
            - name: DOWNSTREAM_SECRET
              valueFrom:
                secretKeyRef:
                  name: sinal-mcp-server
                  key: JWT_SIGNING_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 320Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sinal-bff
  namespace: sinal
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: bff
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30932
