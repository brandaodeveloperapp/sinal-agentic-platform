apiVersion: apps/v1
kind: Deployment
metadata:
  name: sinal-mcp-server
  namespace: sinal
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/part-of: sinal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/part-of: sinal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: localhost:5000/sinal/mcp-server:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: ENVIRONMENT
              value: hom
            - name: LOG_LEVEL
              value: info
            - name: API_TELECOM_URL
              value: http://sinal-api-telecom.sinal.svc.cluster.local:8081
            - name: TOOL_CALL_TIMEOUT_MS
              value: "8000"
            - name: TOOL_CALL_MAX_RETRIES
              value: "2"
          envFrom:
            - secretRef:
                name: sinal-mcp-server
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 320Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sinal-mcp-server
  namespace: sinal
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mcp-server
  ports:
    - name: http
      port: 8082
      targetPort: http
      nodePort: 30931
