apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sinal-bff
  namespace: sinal
  labels:
    app.kubernetes.io/part-of: sinal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sinal-bff
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sinal-agent
  namespace: sinal
  labels:
    app.kubernetes.io/part-of: sinal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sinal-agent
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 3
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sinal-mcp-server
  namespace: sinal
  labels:
    app.kubernetes.io/part-of: sinal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sinal-mcp-server
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
