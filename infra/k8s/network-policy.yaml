apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-telecom-accepts-mcp-only
  namespace: sinal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-telecom
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-server
      ports:
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-accepts-bff-only
  namespace: sinal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
      ports:
        - protocol: TCP
          port: 8083
