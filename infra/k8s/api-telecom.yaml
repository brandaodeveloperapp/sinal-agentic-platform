apiVersion: apps/v1
kind: Deployment
metadata:
  name: sinal-api-telecom
  namespace: sinal
  labels:
    app.kubernetes.io/name: api-telecom
    app.kubernetes.io/part-of: sinal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-telecom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-telecom
        app.kubernetes.io/part-of: sinal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: localhost:5000/sinal/api-telecom:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: ENVIRONMENT
              value: hom
            - name: LOG_LEVEL
              value: info
          envFrom:
            - secretRef:
                name: sinal-api-telecom
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sinal-api-telecom
  namespace: sinal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-telecom
  ports:
    - name: http
      port: 8081
      targetPort: http
