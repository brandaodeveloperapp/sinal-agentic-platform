server {
    listen 80;
    listen [::]:80;
    server_name sinal.brandaodeveloper.com.br;

    access_log /var/log/nginx/sinal.access.log;
    error_log  /var/log/nginx/sinal.error.log;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /mcp {
        proxy_pass http://127.0.0.1:30931;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:30931/health;
        proxy_set_header Host $host;
    }

    location = / {
        default_type text/plain;
        return 200 "Sinal agentic platform. MCP endpoint: POST /mcp (Bearer token required).\n";
    }

    location / {
        return 404;
    }
}
