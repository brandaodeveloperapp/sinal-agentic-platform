<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Animated AWS request flow for the Sinal platform">
  <title>Sinal on AWS — one request, end to end</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4db2ff"/>
      <stop offset="100%" stop-color="#0b6bcb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8aa0b6"/>
    </marker>
    <style>
      .card{fill:#141922;stroke:#2b3442;stroke-width:1.5;rx:12}
      .aws{fill:#ff9900}
      .svc{fill:#e8eaed;font-size:14px;font-weight:600}
      .sub{fill:#9aa6b2;font-size:11px}
      .lane{fill:#9aa6b2;font-size:11px;letter-spacing:.08em}
      .flow{stroke:url(#edge);stroke-width:2.5;fill:none;opacity:.5}
      .back{stroke:#22c55e;stroke-width:2.5;fill:none;opacity:.5;stroke-dasharray:6 6}
      .zone{fill:none;stroke:#2b3442;stroke-width:1.2;stroke-dasharray:4 5;rx:14}
      .ztext{fill:#6b7683;font-size:11px;letter-spacing:.1em}
    </style>
  </defs>

  <rect width="1040" height="560" fill="#0b0e13"/>
  <text x="34" y="40" fill="#e8eaed" font-size="20" font-weight="700">Sinal on AWS — one request, end to end</text>
  <text x="34" y="62" fill="#9aa6b2" font-size="13">A subscriber asks a question. The blue path is the request in; the green dashed path is the streamed answer back.</text>

  <!-- VPC zone -->
  <rect class="zone" x="250" y="96" width="756" height="400"/>
  <text class="ztext" x="266" y="116">VPC · PRIVATE SUBNETS (2 AZ)</text>

  <!-- nodes -->
  <!-- Browser -->
  <g>
    <rect class="card" x="34" y="230" width="150" height="88" rx="12"/>
    <text class="svc" x="52" y="264">Browser</text>
    <text class="sub" x="52" y="284">React · SSE</text>
    <text class="sub" x="52" y="300">session token</text>
  </g>

  <!-- CloudFront + WAF -->
  <g>
    <rect class="card" x="250" y="120" width="150" height="80" rx="12"/>
    <circle class="aws" cx="270" cy="146" r="6"/>
    <text class="svc" x="286" y="150">CloudFront</text>
    <text class="sub" x="266" y="172">AWS WAF</text>
    <text class="sub" x="266" y="188">TLS termination</text>
  </g>

  <!-- ALB / API Gateway -->
  <g>
    <rect class="card" x="250" y="230" width="150" height="88" rx="12"/>
    <circle class="aws" cx="270" cy="256" r="6"/>
    <text class="svc" x="286" y="260">ALB + API GW</text>
    <text class="sub" x="266" y="282">public entry</text>
    <text class="sub" x="266" y="298">only reaches BFF</text>
  </g>

  <!-- BFF -->
  <g>
    <rect class="card" x="430" y="230" width="150" height="88" rx="12"/>
    <circle class="aws" cx="450" cy="256" r="6"/>
    <text class="svc" x="466" y="260">BFF</text>
    <text class="sub" x="446" y="282">ECS Fargate</text>
    <text class="sub" x="446" y="298">authn · token swap</text>
  </g>

  <!-- Agent -->
  <g>
    <rect class="card" x="610" y="230" width="150" height="88" rx="12"/>
    <circle class="aws" cx="630" cy="256" r="6"/>
    <text class="svc" x="646" y="260">Agent</text>
    <text class="sub" x="626" y="282">Fargate · Strands</text>
    <text class="sub" x="626" y="298">agent loop</text>
  </g>

  <!-- Bedrock above agent -->
  <g>
    <rect class="card" x="610" y="120" width="150" height="80" rx="12"/>
    <circle class="aws" cx="630" cy="146" r="6"/>
    <text class="svc" x="646" y="150">Bedrock</text>
    <text class="sub" x="626" y="172">Claude Sonnet</text>
    <text class="sub" x="626" y="188">via IAM role</text>
  </g>

  <!-- MCP -->
  <g>
    <rect class="card" x="790" y="230" width="150" height="88" rx="12"/>
    <circle class="aws" cx="810" cy="256" r="6"/>
    <text class="svc" x="826" y="260">MCP Server</text>
    <text class="sub" x="806" y="282">Fargate</text>
    <text class="sub" x="806" y="298">tool authorization</text>
  </g>

  <!-- API -->
  <g>
    <rect class="card" x="790" y="360" width="150" height="88" rx="12"/>
    <circle class="aws" cx="810" cy="386" r="6"/>
    <text class="svc" x="826" y="390">Corporate API</text>
    <text class="sub" x="806" y="412">Fargate</text>
    <text class="sub" x="806" y="428">system of record</text>
  </g>

  <!-- Secrets + CloudWatch -->
  <g>
    <rect class="card" x="430" y="360" width="150" height="88" rx="12"/>
    <circle class="aws" cx="450" cy="386" r="6"/>
    <text class="svc" x="466" y="390">Secrets Mgr</text>
    <text class="sub" x="446" y="412">signing secrets</text>
    <text class="sub" x="446" y="428">workload key</text>
  </g>

  <!-- forward flow path: browser -> ALB -> BFF -> Agent -> MCP -> API -->
  <path id="p" class="flow" d="M184 274 L250 274 M400 274 L430 274 M580 274 L610 274 M760 274 L790 274 M865 318 L865 360"/>
  <!-- return (green) path along the same spine -->
  <path id="pb" class="back" d="M790 288 L760 288 M610 288 L580 288 M430 288 L400 288 M250 288 L184 288"/>

  <!-- agent <-> bedrock -->
  <path class="flow" d="M685 230 L685 200" marker-end="url(#arrow)"/>
  <!-- bff <-> secrets -->
  <path class="flow" d="M505 318 L505 360" marker-end="url(#arrow)"/>

  <!-- arrowheads on the spine -->
  <path d="M244 274 l-9 -4.5 v9 z" fill="#8aa0b6"/>
  <path d="M424 274 l-9 -4.5 v9 z" fill="#8aa0b6"/>
  <path d="M604 274 l-9 -4.5 v9 z" fill="#8aa0b6"/>
  <path d="M784 274 l-9 -4.5 v9 z" fill="#8aa0b6"/>

  <!-- moving request dot -->
  <circle r="6" fill="#4db2ff">
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;0.16;0.16;0.42;0.42;0.68;0.68;0.86;0.86;1;1" keyTimes="0;0.14;0.20;0.40;0.46;0.66;0.72;0.86;0.90;0.98;1" calcMode="linear"
      path="M184 274 L250 274 L400 274 L430 274 L580 274 L610 274 L760 274 L790 274 L865 274 L865 360 L865 360"/>
  </circle>

  <!-- streamed answer dots (green), returning -->
  <circle r="5" fill="#22c55e">
    <animateMotion dur="4s" begin="2s" repeatCount="indefinite"
      path="M865 360 L865 288 L790 288 L610 288 L580 288 L430 288 L400 288 L250 288 L184 288"/>
  </circle>
  <circle r="5" fill="#22c55e" opacity="0.6">
    <animateMotion dur="4s" begin="2.4s" repeatCount="indefinite"
      path="M865 360 L865 288 L790 288 L610 288 L580 288 L430 288 L400 288 L250 288 L184 288"/>
  </circle>

  <!-- captions -->
  <text class="lane" x="34" y="360">1 · user token in</text>
  <text class="lane" x="446" y="214">2 · session → downstream</text>
  <text class="lane" x="626" y="340">3 · scoped tools only</text>
  <text class="lane" x="806" y="340">4 · workload key</text>
  <text class="lane" x="640" y="512" fill="#22c55e">SSE answer streams back to the browser, token by token</text>
</svg>
