<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Animated two-token exchange">
  <title>Two tokens, two keys — the exchange</title>
  <defs>
    <style>
      .card{fill:#141922;stroke:#2b3442;stroke-width:1.5}
      .svc{fill:#e8eaed;font-size:14px;font-weight:600}
      .sub{fill:#9aa6b2;font-size:11px}
      .lab{fill:#9aa6b2;font-size:11px}
      .spine{stroke:#2b3442;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1040" height="420" fill="#0b0e13"/>
  <text x="34" y="40" fill="#e8eaed" font-size="20" font-weight="700">Two tokens, two keys — the exchange</text>
  <text x="34" y="62" fill="#9aa6b2" font-size="13">A stolen session token cannot be replayed at the MCP server: wrong audience, wrong key, and it expires in minutes.</text>

  <!-- lanes -->
  <g>
    <rect class="card" x="34" y="150" width="150" height="96" rx="12"/>
    <text class="svc" x="52" y="184">Browser</text>
    <text class="sub" x="52" y="206">holds session token</text>
    <text class="sub" x="52" y="224">in memory only</text>
  </g>
  <g>
    <rect class="card" x="445" y="150" width="150" height="96" rx="12"/>
    <text class="svc" x="463" y="184">BFF</text>
    <text class="sub" x="463" y="206">verifies session</text>
    <text class="sub" x="463" y="224">mints downstream</text>
  </g>
  <g>
    <rect class="card" x="856" y="150" width="150" height="96" rx="12"/>
    <text class="svc" x="874" y="184">MCP Server</text>
    <text class="sub" x="874" y="206">verifies downstream</text>
    <text class="sub" x="874" y="224">aud sinal-mcp</text>
  </g>

  <line class="spine" x1="184" y1="198" x2="445" y2="198"/>
  <line class="spine" x1="595" y1="198" x2="856" y2="198"/>

  <!-- session token packet (amber) browser -> bff -->
  <g>
    <rect x="-64" y="184" width="64" height="28" rx="6" fill="#3a2a12" stroke="#9a6700"/>
    <text x="-32" y="202" fill="#fbbf24" font-size="10" text-anchor="middle">session</text>
    <animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite"
      keyTimes="0;0.35;1" values="248 0; 509 0; 509 0" calcMode="spline" keySplines="0.4 0 0.2 1; 0 0 1 1"/>
  </g>

  <!-- downstream token packet (teal) bff -> mcp, appears after exchange -->
  <g opacity="0">
    <rect x="-72" y="184" width="72" height="28" rx="6" fill="#062018" stroke="#00a884"/>
    <text x="-36" y="202" fill="#4db2ff" font-size="10" text-anchor="middle">downstream</text>
    <animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite"
      keyTimes="0;0.45;0.5;1" values="659 0;659 0;659 0;920 0" calcMode="spline" keySplines="0 0 1 1;0 0 1 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" keyTimes="0;0.45;0.5;0.95;1" values="0;0;1;1;0"/>
  </g>

  <!-- token attributes -->
  <g fill="#9aa6b2" font-size="12">
    <text x="230" y="300" fill="#fbbf24" font-weight="600">session token</text>
    <text x="230" y="320">aud: sinal-bff</text>
    <text x="230" y="338">key: gateway secret</text>
    <text x="230" y="356">ttl: 30 min</text>

    <text x="640" y="300" fill="#4db2ff" font-weight="600">downstream token</text>
    <text x="640" y="320">aud: sinal-mcp</text>
    <text x="640" y="338">key: resource secret</text>
    <text x="640" y="356">ttl: 5 min · re-resolved from directory</text>
  </g>
</svg>
